name: App checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app test dependencies
        run: python -m pip install fastapi==0.141.1 httpx==0.28.1 psutil==7.2.2 pydantic==2.13.5 python-multipart==0.0.32 sse-starlette==3.4.11
      - name: Compile Python and check JavaScript
        run: |
          python -m compileall -q app tools tests
          node --check app/static/app.js
      - name: Test backend status and GPU telemetry isolation
        run: python -m unittest discover -s tests -v
